// Forge for Minecraft 26.3 (Forge 66.0.12), based on the official Forge MDK for the 26.3 branch.
// Minecraft 26.x is not obfuscated, so there is no "mappings" line any more.

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '1.0.0'
group = 'com.dotamobs'

base {
    archivesName = 'dotamobs'
}

// Mojang ships Java 25 to end users in 26.1+, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }

        register('client')

        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.0.12')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Fill in the version placeholder in mods.toml.
tasks.named('processResources') {
    var props = [
        mod_version: project.version,
    ]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}
